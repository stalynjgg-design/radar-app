name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y crear proyecto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Agregar permisos de ubicación en segundo plano al Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" \/>\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>/g' $MANIFEST

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Radar-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
